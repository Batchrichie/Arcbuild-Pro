name: Fetch BOG FX Rates

on:
  schedule:
    - cron: '0 8 * * 1-5'   # 8am UTC weekdays
  workflow_dispatch:

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch BOG page
        run: |
          curl -sSL \
            --user-agent "Mozilla/5.0 (compatible; FX-fetcher/1.0)" \
            "https://www.bog.gov.gh/treasury-and-the-markets/daily-interbank-fx-rates/" \
            -o bog.html

      - name: POST HTML to Edge Function
        run: |
          curl -sSf -X POST \
            "https://prpvozkyiybcffuccdoe.functions.supabase.co/fetch-bog-fx" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: text/html" \
            --data-binary @bog.html
